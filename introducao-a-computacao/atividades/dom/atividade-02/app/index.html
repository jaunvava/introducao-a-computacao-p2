<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Pokédex - API</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Pokédex</h1>
        <p class="subtitle">Descubra os detalhes dos seus Pokémons!</p>
      </header>

      <main class="main-content">
        <section class="search-section">
          <div class="search-container">
            <input
              type="text"
              id="buscar-pokemon"
              placeholder="Digite o nome ou número do Pokémon..."
              onkeypress="handleKeyPress(event)"
            />
            <button onclick="handleGetPokemon()" class="search-btn">
              Buscar
            </button>
          </div>

          <div class="search-options">
            <button onclick="clearResults()" class="option-btn clear-btn">
              Limpar
            </button>
          </div>
        </section>

        <section class="results-section">
          <div id="exibir-pokemon" class="pokemon-display"></div>
          <div id="pokemon-list" class="pokemon-list-display"></div>
        </section>
      </main>
    </div>

    <script src="../api/consumindoJson.js"></script>
  </body>
</html>
