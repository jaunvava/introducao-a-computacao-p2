<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atividade - DOM</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Formulário de Inserção de Dados</h1>

      <form>
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" placeholder="Digite seu nome" required />
        </div>

        <div class="form-group">
          <label for="idade">Idade:</label>
          <input
            type="number"
            id="idade"
            placeholder="Digite sua idade"
            min="1"
            max="120"
            required
          />
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem:</label>
          <textarea
            id="mensagem"
            placeholder="Digite sua mensagem"
            rows="4"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="cor">Cor do Texto:</label>
          <input type="color" id="cor" value="#333333" />
        </div>
        <p id="alert" style="display: none; color: red"></p>
        <button type="button" onclick="adicionarTexto()">Enviar</button>
      </form>

      <div id="resultado">
        <h2>Resultado:</h2>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
